<svg xmlns="http://www.w3.org/2000/svg" width="880" height="330" aria-label="PAUSE: Clé secrète visible" role="img" viewBox="0 0 880 330"><rect width="880" height="330" fill="#0E1A1C" rx="18"/><rect width="840" height="36" x="20" y="18" fill="#16252A" rx="10"/><text x="38" y="42" fill="#9DB7BB" font-family="Consolas, 'SFMono-Regular', Menlo, monospace" font-size="15">Toi : Ajoute un bouton de paiement Stripe. Voici ma clé : sk_live_••••••••</text><rect width="840" height="42" x="20" y="66" fill="#F5C518" rx="10"/><rect width="6" height="18" x="34" y="78" fill="#111" rx="1.5"/><rect width="6" height="18" x="45" y="78" fill="#111" rx="1.5"/><text x="64" y="94" fill="#111" font-family="'Segoe UI', Helvetica, Arial, sans-serif" font-size="18" font-weight="800" letter-spacing="2">PAUSE</text><text x="136" y="94" fill="#111" font-family="'Segoe UI', Helvetica, Arial, sans-serif" font-size="18" font-weight="600">Clé secrète visible</text><text x="38" y="140" fill="#EAF4F4" font-family="'Segoe UI', Helvetica, Arial, sans-serif" font-size="15">Ce qui se passe : cette clé ouvre tout ton compte Stripe, et la page est du code que tout le monde peut lire.</text><text x="38" y="166" fill="#EAF4F4" font-family="'Segoe UI', Helvetica, Arial, sans-serif" font-size="15">Risque si on continue : quelqu&apos;un copie la clé et fait des paiements ou des remboursements à ta place.</text><rect width="840" height="56" x="20" y="186" fill="#1F6F78" rx="12"/><circle cx="50" cy="214" r="14" fill="#EAF4F4"/><text x="50" y="219" fill="#1F6F78" font-family="'Segoe UI', Helvetica, Arial, sans-serif" font-size="15" font-weight="800" text-anchor="middle">1</text><text x="76" y="210" fill="#EAF4F4" font-family="'Segoe UI', Helvetica, Arial, sans-serif" font-size="15" font-weight="600">Ranger la clé dans tes variables secrètes, ne l&apos;utiliser que côté serveur, puis la remplacer</text><text x="76" y="231" fill="#7FD1D8" font-family="'Segoe UI', Helvetica, Arial, sans-serif" font-size="13">2 min · recommandé</text><rect width="840" height="56" x="20" y="254" fill="none" stroke="#2C4248" stroke-width="2" rx="12"/><circle cx="50" cy="282" r="14" fill="#2C4248"/><text x="50" y="287" fill="#EAF4F4" font-family="'Segoe UI', Helvetica, Arial, sans-serif" font-size="15" font-weight="800" text-anchor="middle">2</text><text x="76" y="287" fill="#9DB7BB" font-family="'Segoe UI', Helvetica, Arial, sans-serif" font-size="15">Continuer quand même, et noter le risque dans ton carnet</text></svg>