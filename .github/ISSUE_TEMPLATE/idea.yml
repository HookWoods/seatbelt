name: Idea
description: Something Seatbelt should catch, explain or do.
labels: [idea]
body:
  - type: textarea
    id: problem
    attributes:
      label: The problem
      description: What went wrong, or what you could not do, in your own project.
    validations:
      required: true
  - type: textarea
    id: idea
    attributes:
      label: What would help
    validations:
      required: true
